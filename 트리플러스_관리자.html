<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트리플러스 KB 관리자</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root{--bg:#f0f4ff;--surface:#fff;--border:#d0d9ee;--accent:#2563eb;--accent2:#059669;--danger:#ef4444;--warn:#f59e0b;--text:#1a1f36;--text2:#4b5680;--text3:#94a3c0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 로그인 화면 */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(37,99,235,.1)}
.login-logo{font-size:40px;margin-bottom:16px}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 24px;font-size:15px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;width:100%;justify-content:center;font-weight:500}
.google-btn:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(37,99,235,.15)}
.login-err{color:var(--danger);font-size:13px;margin-top:16px;display:none}

/* 관리자 앱 */
#admin-app{display:none}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:16px;font-weight:700;color:var(--accent)}
.hdr-sub{font-size:12px;color:var(--text2)}
.hdr-user{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-email{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text2);font-family:'Noto Sans KR',sans-serif}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

/* 사이드바 + 콘텐츠 */
.layout{display:flex;min-height:calc(100vh - 57px)}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.sb-section{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;padding:16px 20px 6px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sb-item:hover{background:var(--bg);color:var(--text)}
.sb-item.active{background:#eff6ff;color:var(--accent);border-left-color:var(--accent);font-weight:600}
.sb-count{margin-left:auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:10px;font-family:monospace;color:var(--text3)}
.content{flex:1;padding:28px 32px;overflow-x:auto}

/* 페이지 헤더 */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:700}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-inp{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);outline:none;width:220px;transition:border-color .2s}
.search-inp:focus{border-color:var(--accent)}
.btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-success{background:var(--accent2);color:#fff}
.btn-success:hover{background:#047857}
.btn-warn{background:var(--warn);color:#fff}
.btn-warn:hover{background:#d97706}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px}

/* 테이블 */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dtbl{width:100%;border-collapse:collapse;font-size:13px}
.dtbl th{background:#f8fafc;color:var(--text2);padding:11px 14px;text-align:left;font-weight:600;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5}
.dtbl td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;line-height:1.6}
.dtbl tr:last-child td{border-bottom:none}
.dtbl tr:hover td{background:#f8fafc}
.td-q{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-a{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.td-actions{white-space:nowrap;text-align:right}
.tag-xs{display:inline-block;font-size:10px;background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 6px;font-weight:600}
.tag-s{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.tag-triplus{background:#d1fae5;color:#065f46}
.tag-occupi{background:#ffedd5;color:#92400e}
.tag-manual{background:#dbeafe;color:#1d4ed8}
.tag-on{background:#d1fae5;color:#065f46}
.tag-off{background:#fee2e2;color:#991b1b}

/* 통계 카드 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--accent);font-family:monospace}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}

/* 로딩 */
.loading{text-align:center;padding:60px;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}

/* 모달 */
.modal-bg{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:20px;color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:100px;resize:vertical;line-height:1.7}
.field textarea.tall{min-height:160px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.msg{font-size:12px;margin-top:8px;text-align:right;min-height:16px;color:var(--accent2)}
.msg.err{color:var(--danger)}

/* 페이지네이션 */
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px;border-top:1px solid var(--border);font-size:13px;color:var(--text2)}
.pager-btns{display:flex;gap:6px}
.pager-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.pager-btn:hover{border-color:var(--accent);color:var(--accent)}
.pager-btn:disabled{opacity:.4;cursor:not-allowed}
.pager-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🔐</div>
    <div class="login-title">트리플러스 KB 관리자</div>
    <div class="login-sub">허가된 계정으로만 접근 가능합니다.<br>구글 계정으로 로그인해주세요.</div>
    <div style="background:#fef9c3;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#854d0e;line-height:1.7">⚠️ 이 페이지는 반드시 <strong>GitHub Pages</strong>에서 열어야 합니다<br>로컬 파일(file://)에서는 구글 로그인이 불가해요</div>
    <button class="google-btn" onclick="signIn()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>
    <div class="login-err" id="login-err">접근이 허용되지 않은 계정입니다.</div>
  </div>
</div>

<!-- 관리자 앱 -->
<div id="admin-app">
  <header>
    <div>
      <div class="hdr-logo">🔑 트리플러스 KB 관리자</div>
      <div class="hdr-sub">현대자동차 트리플러스 지식베이스 관리</div>
    </div>
    <div class="hdr-user">
      <span class="user-email" id="user-email-display"></span>
      <button class="logout-btn" onclick="signOut()">로그아웃</button>
    </div>
  </header>

  <div class="layout">
    <!-- 사이드바 -->
    <div class="sidebar">
      <div class="sb-section">데이터 관리</div>
      <div class="sb-item active" onclick="showTab('qa')" id="sb-qa">
        💬 Q&A <span class="sb-count" id="cnt-qa">-</span>
      </div>
      <div class="sb-item" onclick="showTab('overseas')" id="sb-overseas">
        ✈️ 해외출장 <span class="sb-count" id="cnt-overseas">-</span>
      </div>
      <div class="sb-item" onclick="showTab('nanyang')" id="sb-nanyang">
        🚗 남양시내교통비 <span class="sb-count" id="cnt-nanyang">-</span>
      </div>
      <div class="sb-item" onclick="showTab('jungbig')" id="sb-jungbig">
        📋 증빙규정 <span class="sb-count" id="cnt-jungbig">-</span>
      </div>
      <div class="sb-item" onclick="showTab('sukbak')" id="sb-sukbak">
        🏠 숙박비규정 <span class="sb-count" id="cnt-sukbak">-</span>
      </div>
      <div class="sb-item" onclick="showTab('yowei')" id="sb-yowei">
        📍 예외거리구간 <span class="sb-count" id="cnt-yowei">-</span>
      </div>
      <div class="sb-item" onclick="showTab('gita')" id="sb-gita">
        🚌 기타교통수단 <span class="sb-count" id="cnt-gita">-</span>
      </div>
      <div class="sb-section">계정 관리</div>
      <div class="sb-item" onclick="showTab('accounts')" id="sb-accounts">
        👤 관리자 계정
      </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="content" id="main-content">
      <div class="loading"><div class="spinner"></div><br>데이터 로딩 중...</div>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="modal-bg" id="edit-modal" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <h3 id="modal-title">항목 추가</h3>
  <div id="modal-fields"></div>
  <div class="modal-actions">
    <button class="btn btn-danger btn-sm" id="modal-del-btn" onclick="deleteItem()" style="margin-right:auto;display:none">🗑️ 삭제</button>
    <button class="btn" style="background:#f1f5f9;color:#4b5680" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" id="modal-save-btn" onclick="saveItem()">저장</button>
  </div>
  <div class="msg" id="modal-msg"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
// ── Firebase 초기화 ──────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyCvUli2EwQiaEdWtQdpFHmqIhtTbnbixaE",
  authDomain: "bizplay-kb.firebaseapp.com",
  projectId: "bizplay-kb",
  storageBucket: "bizplay-kb.firebasestorage.app",
  messagingSenderId: "424940526706",
  appId: "1:424940526706:web:9857867a77bfdfdafff6eb"
});
var db = firebase.firestore();
var auth = firebase.auth();

// ── 허용 이메일 목록 (Firestore에서 관리) ────────────
var ALLOWED_EMAILS = [];

async function loadAllowedEmails() {
  try {
    var snap = await db.collection('admin_accounts').get();
    ALLOWED_EMAILS = snap.docs.map(function(d){ return d.data().email; });
    // 첫 실행 시 기본 계정 없으면 생성 안 함 (아래에서 직접 추가)
  } catch(e) {
    console.error('계정 로드 실패:', e);
  }
}

// ── 구글 로그인 ──────────────────────────────────────
async function signIn() {
  var provider = new firebase.auth.GoogleAuthProvider();
  // 로컬 파일(file://)에서는 Firebase Auth 불가 - GitHub Pages에서 사용 필요
  if (location.protocol === 'file:') {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-err').textContent = '⚠️ 로컬 파일에서는 로그인 불가합니다. GitHub Pages에 올려서 사용하세요.';
    document.getElementById('login-err').style.color = '#f59e0b';
    return;
  }
  try {
    await auth.signInWithPopup(provider);
  } catch(e) {
    // Popup 차단 시 redirect로 폴백
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      try {
        await auth.signInWithRedirect(provider);
      } catch(e2) {
        document.getElementById('login-err').style.display = 'block';
        document.getElementById('login-err').textContent = '로그인 실패: ' + e2.message;
      }
    } else {
      document.getElementById('login-err').style.display = 'block';
      document.getElementById('login-err').textContent = '로그인 실패: ' + e.message;
    }
  }
}
window.signIn = signIn;

async function signOut() {
  await auth.signOut();
  location.reload();
}
window.signOut = signOut;

// Redirect 로그인 결과 처리
auth.getRedirectResult().then(function(result) {
  // redirect 완료 후 자동으로 onAuthStateChanged 호출됨
}).catch(function(e) {
  if (e.code && e.code !== 'auth/no-current-user') {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-err').textContent = '로그인 오류: ' + e.message;
  }
});

auth.onAuthStateChanged(async function(user) {
  if (!user) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-app').style.display = 'none';
    return;
  }
  await loadAllowedEmails();
  
  // 허용 이메일 확인 (비어있으면 첫 사용자 허용 후 등록 유도)
  var isAllowed = ALLOWED_EMAILS.length === 0 || ALLOWED_EMAILS.indexOf(user.email) >= 0;
  
  if (!isAllowed) {
    auth.signOut();
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-err').textContent = '접근이 허용되지 않은 계정입니다: ' + user.email;
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  document.getElementById('user-email-display').textContent = user.email;
  
  currentUser = user;
  await loadAllData();
  showTab('qa');
});

// ── 데이터 ──────────────────────────────────────────
var currentUser = null;
var currentTab = 'qa';
var allData = { qa: [], manual: [], tables: {} };
var editDocId = null;
var editCollection = null;
var PAGE_SIZE = 50;
var currentPage = 1;
var currentSearch = '';

async function loadAllData() {
  // QA
  var qaSnap = await db.collection('qa').orderBy(firebase.firestore.FieldPath.documentId()).get();
  allData.qa = qaSnap.docs.map(function(d){ return Object.assign({_id: d.id}, d.data()); });
  document.getElementById('cnt-qa').textContent = allData.qa.length;

  // 매뉴얼
  var manSnap = await db.collection('manual').get();
  allData.manual = manSnap.docs.map(function(d){ return Object.assign({_id: d.id}, d.data()); });

  // 소스별 카운트
  var overseas = allData.manual.filter(function(m){ return m.s === '해외출장을위한이동'; });
  var nanyang = allData.manual.filter(function(m){ return m.s === '남양연구소-시내교통비'; });
  document.getElementById('cnt-overseas').textContent = overseas.length;
  document.getElementById('cnt-nanyang').textContent = nanyang.length;

  // 테이블
  var tblSnap = await db.collection('tables').get();
  allData.tables = {};
  tblSnap.docs.forEach(function(d) {
    var row = Object.assign({_id: d.id}, d.data());
    var tname = row.tableName;
    if (!allData.tables[tname]) allData.tables[tname] = [];
    allData.tables[tname].push(row);
  });
  document.getElementById('cnt-jungbig').textContent = (allData.tables['증빙규정']||[]).length;
  document.getElementById('cnt-sukbak').textContent = (allData.tables['숙박비규정']||[]).length;
  document.getElementById('cnt-yowei').textContent = (allData.tables['예외거리허용구간']||[]).length;
  document.getElementById('cnt-gita').textContent = (allData.tables['기타교통수단구간']||[]).length;

  // 관리자 계정
  var accSnap = await db.collection('admin_accounts').get();
  allData.accounts = accSnap.docs.map(function(d){ return Object.assign({_id: d.id}, d.data()); });
}

// ── 탭 전환 ─────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  currentPage = 1;
  currentSearch = '';
  document.querySelectorAll('.sb-item').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('sb-' + tab).classList.add('active');
  renderTab();
}
window.showTab = showTab;

function renderTab() {
  var c = document.getElementById('main-content');
  if (currentTab === 'qa') renderQA(c);
  else if (currentTab === 'overseas') renderManual(c, '해외출장을위한이동', '✈️ 해외출장');
  else if (currentTab === 'nanyang') renderManual(c, '남양연구소-시내교통비', '🚗 남양시내교통비');
  else if (currentTab === 'jungbig') renderTable(c, '증빙규정', '📋 증빙규정');
  else if (currentTab === 'sukbak') renderTable(c, '숙박비규정', '🏠 숙박비규정');
  else if (currentTab === 'yowei') renderTable(c, '예외거리허용구간', '📍 예외거리허용구간');
  else if (currentTab === 'gita') renderTable(c, '기타교통수단구간', '🚌 기타교통수단구간');
  else if (currentTab === 'accounts') renderAccounts(c);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── QA 탭 ────────────────────────────────────────────
function renderQA(c) {
  var rows = allData.qa.filter(function(r){
    if (!currentSearch) return true;
    var kw = currentSearch.toLowerCase();
    return (r.q||'').toLowerCase().includes(kw) || (r.a||'').toLowerCase().includes(kw) || (r.s||'').toLowerCase().includes(kw);
  });
  var total = rows.length;
  var start = (currentPage-1)*PAGE_SIZE;
  var pageRows = rows.slice(start, start+PAGE_SIZE);

  var html = '<div class="page-hdr">';
  html += '<div class="page-title">💬 Q&A <small style="font-size:14px;color:var(--text2);font-weight:400">총 '+total+'건</small></div>';
  html += '<div class="page-actions">';
  html += '<input class="search-inp" placeholder="질문, 답변, 소스 검색..." value="'+esc(currentSearch)+'" oninput="onSearch(this.value)" id="search-inp">';
  html += '<button class="btn btn-success" onclick="openAdd()">+ Q&A 추가</button></div></div>';

  html += '<div class="tbl-wrap"><table class="dtbl"><thead><tr>';
  html += '<th style="width:80px">소스</th><th style="width:90px">카테고리</th>';
  html += '<th>질문</th><th>답변</th><th style="width:60px">제외</th><th style="width:80px">관리</th>';
  html += '</tr></thead><tbody>';

  pageRows.forEach(function(r) {
    var srcTag = r.s === '트리플러스' ? 'tag-triplus' : 'tag-occupi';
    html += '<tr>';
    html += '<td><span class="tag-s '+srcTag+'">'+esc(r.s)+'</span></td>';
    html += '<td style="font-size:11px;color:var(--text2)">'+esc(r.c)+'</td>';
    html += '<td class="td-q">'+esc(r.q)+'</td>';
    html += '<td class="td-a">'+esc(r.a)+'</td>';
    html += '<td>'+(r.xs ? '<span class="tag-xs">제외</span>' : '')+'</td>';
    html += '<td class="td-actions"><button class="btn btn-warn btn-sm" onclick="openEdit(\'qa\',\''+r._id+'\')">수정</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += renderPager(total);
  html += '</div>';
  c.innerHTML = html;
}

// ── 매뉴얼 탭 ────────────────────────────────────────
function renderManual(c, source, title) {
  var rows = allData.manual.filter(function(r){
    if (r.s !== source) return false;
    if (!currentSearch) return true;
    var kw = currentSearch.toLowerCase();
    return (r.q||'').toLowerCase().includes(kw) || (r.a||'').toLowerCase().includes(kw) || (r.c||'').toLowerCase().includes(kw) || (r.it||'').toLowerCase().includes(kw);
  });
  var total = rows.length;
  var start = (currentPage-1)*PAGE_SIZE;
  var pageRows = rows.slice(start, start+PAGE_SIZE);

  var html = '<div class="page-hdr">';
  html += '<div class="page-title">'+title+' <small style="font-size:14px;color:var(--text2);font-weight:400">총 '+total+'건</small></div>';
  html += '<div class="page-actions">';
  html += '<input class="search-inp" placeholder="검색..." value="'+esc(currentSearch)+'" oninput="onSearch(this.value)">';
  html += '<button class="btn btn-success" onclick="openAddManual(\''+source+'\')">+ 항목 추가</button></div></div>';

  html += '<div class="tbl-wrap"><table class="dtbl"><thead><tr>';
  html += '<th>카테고리</th><th>항목명</th><th>질문/제목</th><th>답변/내용</th><th style="width:60px">제외</th><th style="width:80px">관리</th>';
  html += '</tr></thead><tbody>';

  pageRows.forEach(function(r) {
    html += '<tr>';
    html += '<td style="font-size:11px;white-space:nowrap">'+esc(r.c)+'</td>';
    html += '<td style="font-size:11px;white-space:nowrap;color:var(--text2)">'+esc(r.it)+'</td>';
    html += '<td class="td-q">'+esc(r.q)+'</td>';
    html += '<td class="td-a">'+esc(r.a)+'</td>';
    html += '<td>'+(r.xs ? '<span class="tag-xs">제외</span>' : '')+'</td>';
    html += '<td class="td-actions"><button class="btn btn-warn btn-sm" onclick="openEdit(\'manual\',\''+r._id+'\')">수정</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += renderPager(total);
  html += '</div>';
  c.innerHTML = html;
}

// ── 테이블 탭 ────────────────────────────────────────
var TBL_COLS = {
  '증빙규정': [{k:'type',l:'증빙유형'},{k:'cat',l:'분류'},{k:'case',l:'케이스'},{k:'content',l:'내용'},{k:'remark',l:'비고'}],
  '숙박비규정': [{k:'purpose',l:'출장목적'},{k:'gubun',l:'구분'},{k:'usergrp',l:'사용자그룹'},{k:'dest',l:'행선지'},{k:'pay_type',l:'지급유형'},{k:'amount',l:'금액'},{k:'option',l:'옵션'},{k:'remark',l:'비고'}],
  '예외거리허용구간': [{k:'from',l:'출발지'},{k:'to',l:'도착지'},{k:'type',l:'구간유형'},{k:'status',l:'사용여부'}],
  '기타교통수단구간': [{k:'from',l:'출발지'},{k:'to',l:'도착지'},{k:'amount',l:'정액요금'}]
};

function renderTable(c, tname, title) {
  var cols = TBL_COLS[tname] || [];
  var rows = (allData.tables[tname] || []).filter(function(r){
    if (!currentSearch) return true;
    var kw = currentSearch.toLowerCase();
    return cols.some(function(col){ return (r[col.k]||'').toLowerCase().includes(kw); });
  });
  var total = rows.length;
  var start = (currentPage-1)*PAGE_SIZE;
  var pageRows = rows.slice(start, start+PAGE_SIZE);

  var html = '<div class="page-hdr">';
  html += '<div class="page-title">'+title+' <small style="font-size:14px;color:var(--text2);font-weight:400">총 '+total+'건</small></div>';
  html += '<div class="page-actions">';
  html += '<input class="search-inp" placeholder="검색..." value="'+esc(currentSearch)+'" oninput="onSearch(this.value)">';
  html += '<button class="btn btn-success" onclick="openAddTable(\''+tname+'\')">+ 항목 추가</button></div></div>';

  html += '<div class="tbl-wrap"><table class="dtbl"><thead><tr>';
  cols.forEach(function(col){ html += '<th>'+col.l+'</th>'; });
  html += '<th style="width:80px">관리</th></tr></thead><tbody>';

  pageRows.forEach(function(r) {
    html += '<tr>';
    cols.forEach(function(col){
      var val = esc(r[col.k]||'');
      if (col.k === 'status') {
        val = '<span class="tag-s '+(r[col.k]==='사용'?'tag-on':'tag-off')+'">'+esc(r[col.k]||'')+'</span>';
      }
      html += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+val+'</td>';
    });
    html += '<td class="td-actions"><button class="btn btn-warn btn-sm" onclick="openEdit(\'tables\',\''+r._id+'\',\''+tname+'\')">수정</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += renderPager(total);
  html += '</div>';
  c.innerHTML = html;
}

// ── 관리자 계정 탭 ───────────────────────────────────
function renderAccounts(c) {
  var html = '<div class="page-hdr">';
  html += '<div class="page-title">👤 관리자 계정</div>';
  html += '<div class="page-actions"><button class="btn btn-success" onclick="openAddAccount()">+ 계정 추가</button></div></div>';
  html += '<div class="tbl-wrap"><table class="dtbl"><thead><tr><th>이메일</th><th>추가일</th><th style="width:80px">관리</th></tr></thead><tbody>';
  (allData.accounts||[]).forEach(function(acc) {
    html += '<tr><td>'+esc(acc.email)+'</td><td style="font-size:11px;color:var(--text2)">'+esc(acc.added_at||'')+'</td>';
    html += '<td><button class="btn btn-danger btn-sm" onclick="deleteAccount(\''+acc._id+'\')">삭제</button></td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="margin-top:16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 18px;font-size:13px;color:#1e40af;line-height:1.8">';
  html += '⚠️ <strong>주의:</strong> 계정 목록이 비어있으면 모든 구글 계정으로 접근 가능합니다.<br>최소 1개 이상의 계정을 등록해두세요.';
  html += '</div>';
  c.innerHTML = html;
}

// ── 페이지네이션 ─────────────────────────────────────
function renderPager(total) {
  var totalPages = Math.ceil(total / PAGE_SIZE);
  if (totalPages <= 1) return '';
  var html = '<div class="pager">';
  html += '<span>'+((currentPage-1)*PAGE_SIZE+1)+' - '+Math.min(currentPage*PAGE_SIZE,total)+' / '+total+'건</span>';
  html += '<div class="pager-btns">';
  html += '<button class="pager-btn" onclick="goPage('+(currentPage-1)+')" '+(currentPage<=1?'disabled':'')+'>이전</button>';
  var start = Math.max(1, currentPage-2);
  var end = Math.min(totalPages, start+4);
  for (var i=start; i<=end; i++) {
    html += '<button class="pager-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  }
  html += '<button class="pager-btn" onclick="goPage('+(currentPage+1)+')" '+(currentPage>=totalPages?'disabled':'')+'>다음</button>';
  html += '</div></div>';
  return html;
}
function goPage(p) { currentPage = p; renderTab(); window.scrollTo(0,0); }
window.goPage = goPage;
function onSearch(v) { currentSearch = v; currentPage = 1; renderTab(); }
window.onSearch = onSearch;

// ── 편집 모달 ────────────────────────────────────────
var editTableName = null;

function buildFields(schema, data) {
  return schema.map(function(f) {
    var val = data ? (data[f.k] || '') : '';
    var req = f.req !== false;
    var html = '<div class="field"><label>'+f.l+(req?' <span style="color:#ef4444">*</span>':'')+'</label>';
    if (f.type === 'select') {
      html += '<select id="f-'+f.k+'">'+f.opts.map(function(o){ return '<option value="'+o+'"'+(val===o?' selected':'')+'>'+o+'</option>'; }).join('')+'</select>';
    } else if (f.type === 'textarea' || f.tall) {
      html += '<textarea id="f-'+f.k+'" class="'+(f.tall?'tall':'')+'" placeholder="'+(f.hint||'')+'">'+esc(val)+'</textarea>';
    } else {
      html += '<input id="f-'+f.k+'" type="text" value="'+esc(val)+'" placeholder="'+(f.hint||'')+'">';
    }
    return html + '</div>';
  }).join('');
}

var QA_SCHEMA = [
  {k:'s',l:'소스',type:'select',opts:['트리플러스','오큐파이']},
  {k:'c',l:'카테고리',type:'select',opts:['정산 문의','서비스 이용문의','기타','버그 및 오류 신고']},
  {k:'q',l:'질문',tall:true,hint:'질문 내용'},
  {k:'a',l:'답변',tall:true,hint:'답변 내용'},
  {k:'xs',l:'AI검색 제외',type:'select',opts:['0','1'],hint:'0=포함 / 1=제외'}
];

var MAN_SCHEMA = [
  {k:'s',l:'소스',type:'select',opts:['해외출장을위한이동','남양연구소-시내교통비','출장정책','운영정책','증빙규정','숙박비규정']},
  {k:'c',l:'카테고리',hint:'예: 공항이동'},
  {k:'it',l:'항목명',hint:'예: 교통비·유류비·통행료'},
  {k:'q',l:'질문/제목',tall:true},
  {k:'a',l:'답변/내용',tall:true},
  {k:'r',l:'비고',req:false},
  {k:'xs',l:'AI검색 제외',type:'select',opts:['0','1']}
];

var TBL_SCHEMA = {
  '증빙규정': [
    {k:'type',l:'증빙유형',hint:'기타증빙 / 마이데이터'},
    {k:'cat',l:'분류',hint:'숙박/교통 등'},
    {k:'case',l:'케이스',hint:'예: 예약이 있는 경우'},
    {k:'content',l:'내용',tall:true},
    {k:'remark',l:'비고',req:false}
  ],
  '숙박비규정': [
    {k:'purpose',l:'출장목적'},{k:'gubun',l:'구분'},{k:'usergrp',l:'사용자그룹'},
    {k:'dest',l:'행선지'},{k:'pay_type',l:'지급유형'},{k:'amount',l:'금액'},
    {k:'option',l:'옵션'},{k:'remark',l:'비고',req:false}
  ],
  '예외거리허용구간': [{k:'from',l:'출발지'},{k:'to',l:'도착지'},{k:'type',l:'구간유형',hint:'왕복/편도'},{k:'status',l:'사용여부',hint:'사용/미사용'}],
  '기타교통수단구간': [{k:'from',l:'출발지'},{k:'to',l:'도착지'},{k:'amount',l:'정액요금',hint:'예: 4,600원'}]
};

function openEdit(col, docId, tname) {
  editDocId = docId;
  editCollection = col;
  editTableName = tname || null;
  
  var data = null;
  if (col === 'qa') data = allData.qa.find(function(r){ return r._id === docId; });
  else if (col === 'manual') data = allData.manual.find(function(r){ return r._id === docId; });
  else if (col === 'tables') data = (allData.tables[tname]||[]).find(function(r){ return r._id === docId; });

  var schema = col === 'qa' ? QA_SCHEMA : col === 'manual' ? MAN_SCHEMA : (TBL_SCHEMA[tname]||[]);
  document.getElementById('modal-title').textContent = '✏️ 수정';
  document.getElementById('modal-fields').innerHTML = buildFields(schema, data);
  document.getElementById('modal-del-btn').style.display = 'inline-block';
  document.getElementById('modal-del-btn').textContent = '🗑️ 삭제';
  document.getElementById('edit-modal').classList.add('open');
}
window.openEdit = openEdit;

function openAdd() {
  editDocId = null; editCollection = 'qa'; editTableName = null;
  document.getElementById('modal-title').textContent = '➕ Q&A 추가';
  document.getElementById('modal-fields').innerHTML = buildFields(QA_SCHEMA, null);
  document.getElementById('modal-del-btn').style.display = 'none';
  document.getElementById('edit-modal').classList.add('open');
}
window.openAdd = openAdd;

function openAddManual(source) {
  editDocId = null; editCollection = 'manual'; editTableName = null;
  document.getElementById('modal-title').textContent = '➕ 항목 추가';
  document.getElementById('modal-fields').innerHTML = buildFields(MAN_SCHEMA, {s: source});
  document.getElementById('modal-del-btn').style.display = 'none';
  document.getElementById('edit-modal').classList.add('open');
}
window.openAddManual = openAddManual;

function openAddTable(tname) {
  editDocId = null; editCollection = 'tables'; editTableName = tname;
  document.getElementById('modal-title').textContent = '➕ ' + tname + ' 추가';
  document.getElementById('modal-fields').innerHTML = buildFields(TBL_SCHEMA[tname]||[], null);
  document.getElementById('modal-del-btn').style.display = 'none';
  document.getElementById('edit-modal').classList.add('open');
}
window.openAddTable = openAddTable;

function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }
window.closeModal = closeModal;

function getFieldValues(schema) {
  var data = {};
  schema.forEach(function(f){
    var el = document.getElementById('f-'+f.k);
    if (el) data[f.k] = el.value.trim();
  });
  return data;
}

async function saveItem() {
  var btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  document.getElementById('modal-msg').textContent = '저장 중...';

  try {
    var schema = editCollection === 'qa' ? QA_SCHEMA : editCollection === 'manual' ? MAN_SCHEMA : (TBL_SCHEMA[editTableName]||[]);
    var data = getFieldValues(schema);
    if (editCollection === 'qa') data.xs = parseInt(data.xs)||0;
    if (editCollection === 'manual') { data.xs = parseInt(data.xs)||0; }
    if (editCollection === 'tables') { data.tableName = editTableName; }

    if (editDocId) {
      await db.collection(editCollection).doc(editDocId).update(data);
    } else {
      var newId = editCollection + '_' + Date.now();
      data.id = newId;
      await db.collection(editCollection).doc(newId).set(data);
    }

    document.getElementById('modal-msg').textContent = '✅ 저장 완료!';
    document.getElementById('modal-msg').className = 'msg';
    closeModal();
    await loadAllData();
    renderTab();
  } catch(e) {
    document.getElementById('modal-msg').textContent = '❌ ' + e.message;
    document.getElementById('modal-msg').className = 'msg err';
  }
  btn.disabled = false;
}
window.saveItem = saveItem;

async function deleteItem() {
  if (!editDocId) return;
  if (!confirm('이 항목을 삭제하시겠습니까? 복구할 수 없습니다.')) return;
  try {
    await db.collection(editCollection).doc(editDocId).delete();
    closeModal();
    await loadAllData();
    renderTab();
  } catch(e) { alert('삭제 실패: ' + e.message); }
}
window.deleteItem = deleteItem;

// ── 관리자 계정 관리 ─────────────────────────────────
function openAddAccount() {
  var email = prompt('추가할 구글 이메일 주소를 입력하세요:');
  if (!email || !email.includes('@')) return;
  db.collection('admin_accounts').add({
    email: email.trim().toLowerCase(),
    added_at: new Date().toISOString().split('T')[0],
    added_by: currentUser.email
  }).then(function() {
    loadAllData().then(function(){ renderAccounts(document.getElementById('main-content')); });
  }).catch(function(e){ alert('추가 실패: ' + e.message); });
}
window.openAddAccount = openAddAccount;

function deleteAccount(docId) {
  if (!confirm('이 계정을 삭제하시겠습니까?')) return;
  db.collection('admin_accounts').doc(docId).delete().then(function() {
    loadAllData().then(function(){ renderAccounts(document.getElementById('main-content')); });
  }).catch(function(e){ alert('삭제 실패: ' + e.message); });
}
window.deleteAccount = deleteAccount;
</script>
